<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0607e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Stillzeit</title>
<style>
  :root { --L: #3f7fbf; --Ld: #2f639a; --Lbg: #e4eef8; --R: #e0863a; --Rd: #b8661f; --Rbg: #fbeadb; --bg: #fbf6f3; --ink: #2b2530; --muted: #9a8f96; --accent: #e0607e; --accent-dark: #c44a68; --card: #fff; --line: #f0e4e6; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior-y: none; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 480px; min-height: 100%; padding: max(env(safe-area-inset-top), 16px) 16px 300px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 4px; }
  h1 { font-size: 20px; font-weight: 700; }
  .version { font-size: 11px; color: #d6c9cd; }
  .pill { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); color: var(--muted); font-size: 13px; cursor: pointer; }
  #since { font-size: 14px; color: var(--muted); padding: 0 4px 4px; min-height: 20px; }
  #since b { color: var(--ink); font-weight: 600; }
  #syncline { font-size: 12px; color: var(--muted); padding: 0 4px 16px; min-height: 16px; }
  #syncline.err { color: var(--accent-dark); }

  /* day groups */
  .day { margin-bottom: 14px; }
  .dayhead { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-radius: 12px; margin-bottom: 6px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .dayhead .cnt { font-size: 13px; font-weight: 700; }
  .dayhead .sum { font-weight: 500; opacity: .85; }
  .row { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 6px; font-size: 16px; line-height: 1.35; user-select: none; }
  .row .t { flex: 1; font-variant-numeric: tabular-nums; }
  .row .d { font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .s { width: 26px; height: 26px; border-radius: 50%; background: #eee; color: #666;
  }
  .row .s.L { background: var(--Lbg); color: var(--Ld); }
  .row .s.R { background: var(--Rbg); color: var(--Rd); }
  .row .s { font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; flex: none; }
  .row .s.none { visibility: hidden; }
  .row .del { display: none; margin-left: 12px; height: 44px; padding: 0 14px; border: none; border-radius: 10px; background: #fde8ee; color: var(--accent-dark); font-size: 14px; font-weight: 600; }
  .row.armed .del { display: inline-block; }
  .row.armed { border-color: var(--accent); }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 36px 12px; line-height: 1.5; }

  /* big button in the thumb zone */
  .dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; padding: 12px 16px calc(env(safe-area-inset-bottom) + 20px); z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(to top, var(--bg) 78%, rgba(251,246,243,0)); }
  #starts { display: flex; gap: 14px; }
  #starts[hidden] { display: none; }
  .side { width: 150px; height: 150px; border-radius: 50%; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .side:active { transform: scale(.97); }
  .side .big { font-size: 34px; font-weight: 800; line-height: 1.1; }
  .side .lbl { font-size: 14px; font-weight: 600; opacity: .9; }
  #startL { background: var(--L); box-shadow: 0 10px 28px rgba(63,127,191,.4); }
  #startR { background: var(--R); box-shadow: 0 10px 28px rgba(224,134,58,.4); }
  #startL.hint { box-shadow: 0 10px 28px rgba(63,127,191,.4), 0 0 0 5px #fff, 0 0 0 8px var(--L); }
  #startR.hint { box-shadow: 0 10px 28px rgba(224,134,58,.4), 0 0 0 5px #fff, 0 0 0 8px var(--R); }
  #big.L { background: var(--Ld); box-shadow: 0 12px 32px rgba(47,99,154,.45); }
  #big.R { background: var(--Rd); box-shadow: 0 12px 32px rgba(184,102,31,.45); }
  #big { width: 190px; height: 190px; border-radius: 50%; border: none; background: var(--ink); color: #fff; font-size: 26px; font-weight: 700; box-shadow: 0 12px 32px rgba(43,37,48,.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; animation: breathe 2.4s ease-in-out infinite; }
  #big[hidden] { display: none; }
  #big:active { transform: scale(.97); }
  #big .clock { font-size: 44px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
  #big .lbl { font-size: 15px; font-weight: 600; opacity: .9; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  #cancel { height: 44px; padding: 0 18px; border: none; border-radius: 22px; background: transparent; color: var(--muted); font-size: 14px; visibility: hidden; }
  #cancel.show { visibility: visible; }

  /* screen navigation */
  .nav { display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; height: 40px; user-select: none; cursor: pointer; letter-spacing: .02em; }
  .nav[hidden] { display: none; }
  .nav .tri { font-size: 10px; }
  #navTop { margin: -8px 0 0; }
  #navBottom { height: 34px; }

  /* tap buttons for the other screens */
  #taps { display: flex; gap: 12px; justify-content: center; }
  #taps[hidden] { display: none; }
  .tap { width: 140px; height: 140px; border-radius: 50%; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 10px 28px rgba(43,37,48,.22); }
  .tap:active { transform: scale(.97); }
  .tap .big { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .tap .lbl { font-size: 13px; font-weight: 600; opacity: .9; }
  #taps.n3 .tap { width: 106px; height: 106px; }
  #taps.n3 .tap .big { font-size: 19px; }
  .tap.pee { background: #d9a441; } .tap.poo { background: #8a6a4a; }
  .tap.measure { background: #2a9d8f; }
  .tap.fever { background: #d9534f; } .tap.cough { background: #5c7f9e; } .tap.note { background: #7a7580; }
  .row .s.pee { background: #fbf0d6; color: #9a6f12; } .row .s.poo { background: #eee4da; color: #6b4d31; }
  .row .s.fever { background: #fbe3e2; color: #a83632; } .row .s.cough { background: #e3ecf4; color: #3f5f7c; } .row .s.note, .row .s.measure { background: #eee; color: #666; }
  .row .sub { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .row .note { flex: 1; font-size: 15px; }

  /* value entry sheet */
  #entry { position: fixed; inset: 0; background: rgba(43,37,48,.35); z-index: 10; display: none; align-items: flex-end; justify-content: center; }
  #entry.open { display: flex; }
  #entry .panel { width: 100%; max-width: 480px; background: var(--card); border-radius: 20px 20px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 20px); }
  #entry h2 { font-size: 18px; margin-bottom: 12px; }
  #entry .valrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #entry input { flex: 1; height: 56px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 24px; background: var(--card); color: var(--ink); }
  #entry input:focus { outline: none; border-color: var(--accent); }
  #entry .unit { font-size: 18px; color: var(--muted); min-width: 36px; }
  #entry .btns { display: flex; gap: 8px; }
  #entry .btns button { flex: 1; height: 52px; border: none; border-radius: 12px; font-size: 16px; background: var(--bg); color: var(--ink); }
  #entry .btns button.primary { background: var(--accent); color: #fff; font-weight: 600; }

  /* menu sheet */
  #sheet { position: fixed; inset: 0; background: rgba(43,37,48,.35); z-index: 9; display: none; align-items: flex-end; justify-content: center; }
  #sheet.open { display: flex; }
  #sheet .panel { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 20px 20px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 20px); }
  .panel button { display: block; width: 100%; height: 52px; border: none; border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 16px; margin-bottom: 8px; text-align: left; padding: 0 16px; }
  .panel button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  .panel .hint { font-size: 12px; color: var(--muted); padding: 4px 4px 10px; line-height: 1.4; }
  .panel .sec { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 4px 8px; }
  .panel input[type=text], .panel input[type=email], .panel input[type=number] { width: 100%; height: 48px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; margin-bottom: 8px; background: var(--card); color: var(--ink); }
  .panel input:focus { outline: none; border-color: var(--accent); }
  .code { font-size: 22px; font-weight: 700; letter-spacing: .12em; font-variant-numeric: tabular-nums; padding: 4px 4px 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="navTop" class="nav" hidden><span class="tri">▲</span><span class="name"></span></div>
  <header>
    <div><h1 id="title">Stillen</h1><div class="version">Stillzeit · v8</div></div>
    <button id="menu" class="pill">⋯</button>
  </header>
  <div id="since"></div>
  <div id="syncline"></div>
  <div id="list"></div>
  <div id="empty" class="empty" hidden></div>
  <div class="dock">
    <div id="starts">
      <button class="side" id="startL"><span class="big">Links</span><span class="lbl">Start</span></button>
      <button class="side" id="startR"><span class="big">Rechts</span><span class="lbl">Start</span></button>
    </div>
    <button id="big" hidden><span class="clock">00:00</span><span class="lbl">Stopp</span></button>
    <div id="taps" hidden></div>
    <button id="cancel">Verwerfen</button>
    <div id="navBottom" class="nav" hidden><span class="tri">▼</span><span class="name"></span></div>
  </div>
</div>
<div id="entry">
  <div class="panel">
    <h2 id="entryTitle"></h2>
    <div class="valrow"><input id="entryVal"><span class="unit" id="entryUnit"></span></div>
    <div class="btns"><button id="entryCancel">Abbrechen</button><button id="entrySave" class="primary">Speichern</button></div>
  </div>
</div>
<div id="sheet">
  <div class="panel">
    <div class="hint" id="stats"></div>

    <div class="sec">Familie &amp; Sync</div>
    <div id="syncBox"></div>

    <div class="sec">Anzeige</div>
    <div class="hint">Stillen kürzer als so viele Sekunden ausblenden (0 = alles zeigen). Die Einträge bleiben gespeichert.</div>
    <input id="minSec" type="number" inputmode="numeric" min="0" step="1" placeholder="0">

    <div class="sec">Daten</div>
    <button id="exportJson">Sicherung als JSON speichern</button>
    <button id="exportCsv">Als CSV exportieren</button>
    <button id="importJson">Sicherung wiederherstellen</button>
    <button id="closeSheet">Schließen</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</div>
<script src="config.js"></script>
<script>
(() => {
  'use strict';
  /* ------------------------------------------------------------------
     Data model (schema 2). One flat event log; all trackers are `type`s.
       db = { schema, device_id, household_id?, active_child, children, events }
       event = { id, type, child_id, start, end?, value?, unit?, note?, side?,
                 created_by, created_at, updated_at, deleted? }
     A running feed is a 'feed' event without `end` (so it syncs to the
     partner's phone and either of them can stop it). See CONCEPT.md.
  ------------------------------------------------------------------ */
  const DB_KEY = 'stillzeit.db';
  const LEGACY_KEY = 'stillzeit.v1';
  const RUN_KEY = 'stillzeit.running';
  const SESSION_KEY = 'stillzeit.session';
  const CFG = window.APP_CONFIG || {};
  const SYNC = CFG.supabaseUrl && CFG.supabaseKey ? { url: CFG.supabaseUrl, key: CFG.supabaseKey } : null;
  const $ = id => document.getElementById(id);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

  let db = null;
  let snap = {};
  let armed = null;
  let tick = null;

  // ---------- storage ----------
  const sigOf = ev => { const c = Object.assign({}, ev); delete c.updated_at; return JSON.stringify(c); };
  function emptyDb() {
    const now = Date.now();
    const child = { id: uid(), name: 'Baby', created_at: now, updated_at: now };
    return { schema: 2, device_id: uid(), household_id: null, active_child: child.id, children: [child], events: [], settings: { minSeconds: 0 } };
  }
  function migrateLegacy(d) {
    let old = [];
    try { old = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]'); } catch (e) { old = []; }
    for (const it of old) if (!d.events.some(e => e.id === String(it.id))) {
      d.events.push({ id: String(it.id), type: 'feed', child_id: d.active_child, start: it.start, end: it.end,
        created_by: d.device_id, created_at: it.end, updated_at: it.updated_at || it.end, deleted: it.deleted || undefined });
    }
    if (old.length) localStorage.removeItem(LEGACY_KEY);
    // v2 kept the running clock in its own key; v3 keeps it as an open event
    let run = null;
    try { run = JSON.parse(localStorage.getItem(RUN_KEY) || 'null'); } catch (e) { run = null; }
    if (typeof run === 'number') run = { start: run, child_id: d.active_child };
    if (run && run.start) d.events.unshift({ id: uid(), type: 'feed', child_id: run.child_id || d.active_child, start: run.start,
      created_by: d.device_id, created_at: run.start, updated_at: Date.now() });
    localStorage.removeItem(RUN_KEY);
  }
  function load() {
    try { db = JSON.parse(localStorage.getItem(DB_KEY) || 'null'); } catch (e) { db = null; }
    if (!db || db.schema !== 2) db = emptyDb();
    if (!('household_id' in db)) db.household_id = null;
    if (!db.settings) db.settings = { minSeconds: 0 };
    for (const c of db.children) if (!c.updated_at) c.updated_at = c.created_at || Date.now();
    migrateLegacy(db);
    snap = {}; for (const ev of db.events) snap[ev.id] = sigOf(ev); for (const c of db.children) snap['c:' + c.id] = sigOf(c);
  }
  function mergeInto(list, inc, key) {
    const i = list.findIndex(x => x.id === inc.id);
    if (i < 0) { list.push(inc); snap[key + inc.id] = sigOf(inc); return true; }
    if ((inc.updated_at || 0) > (list[i].updated_at || 0)) { list[i] = inc; snap[key + inc.id] = sigOf(inc); return true; }
    return false;
  }
  function mergeStored() {
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(DB_KEY) || 'null'); } catch (e) { return; }
    if (!stored || stored.schema !== 2) return;
    for (const o of stored.events) mergeInto(db.events, o, '');
    for (const c of stored.children || []) mergeInto(db.children, c, 'c:');
    if (stored.household_id && !db.household_id) db.household_id = stored.household_id;
  }
  function save() {
    const now = Date.now();
    for (const ev of db.events) { const s = sigOf(ev); if (snap[ev.id] !== s) { ev.updated_at = now; snap[ev.id] = s; } }
    for (const c of db.children) { const s = sigOf(c); if (snap['c:' + c.id] !== s) { c.updated_at = now; snap['c:' + c.id] = s; } }
    mergeStored();
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    scheduleSync();
  }
  window.addEventListener('storage', e => {
    if (e.key === DB_KEY) { mergeStored(); syncButton(); render(); }
    if (e.key === SESSION_KEY) { try { session = JSON.parse(e.newValue || 'null'); } catch (err) {} renderSyncBox(); }
  });

  // ---------- queries ----------
  const alive = () => db.events.filter(e => !e.deleted && e.child_id === db.active_child);
  const minMs = () => (Number(db.settings && db.settings.minSeconds) || 0) * 1000;
  const feeds = () => alive().filter(e => e.type === 'feed' && e.end && (e.end - e.start) >= minMs()).sort((a, b) => b.start - a.start);
  const runningFeed = () => alive().filter(e => e.type === 'feed' && !e.end).sort((a, b) => a.start - b.start)[0] || null;
  function addEvent(ev) {
    const now = Date.now();
    const full = Object.assign({ id: uid(), child_id: db.active_child, created_by: (session && session.uid) || db.device_id, created_at: now, updated_at: now }, ev);
    db.events.unshift(full);
    save();
    return full;
  }

  // ---------- formatting ----------
  const pad = n => String(n).padStart(2, '0');
  const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  function dayLabel(key) {
    const today = dayKey(Date.now()), yest = dayKey(Date.now() - 864e5);
    if (key === today) return 'Heute';
    if (key === yest) return 'Gestern';
    const [y, m, d] = key.split('-');
    return new Date(y, m - 1, d).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  const mins = ms => Math.max(1, Math.round(ms / 60000));
  function durLabel(ms) { if (ms < 60000) return Math.round(ms / 1000) + ' s'; const m = mins(ms); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; }
  function clock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function ago(ms) {
    const m = Math.floor(ms / 60000);
    if (m < 1) return 'gerade eben';
    if (m < 60) return 'vor ' + m + ' min';
    const h = Math.floor(m / 60);
    return 'vor ' + h + ' h ' + (m % 60) + ' min';
  }
  function dayColor(count, hue) {      // more entries per day → deeper tint (scale 0..16)
    const t = Math.min(count, 16) / 16;
    const light = 96 - t * 30;
    const h = hue == null ? 345 : hue;
    return { bg: 'hsl(' + h + ' 70% ' + light + '%)', fg: light < 78 ? '#fff' : (h === 345 ? '#7a2f47' : '#6b4a12') };
  }

  // ---------- screens ----------
  const SCREENS = [
    { key: 'feed', title: 'Stillen', types: ['feed'], empty: 'Noch kein Eintrag.<br>Unten tippen, wenn das Stillen beginnt.' },
    { key: 'diaper', title: 'Windel', types: ['pee', 'poo'], empty: 'Noch keine Windel.<br>Unten tippen: Urin oder Stuhl.',
      buttons: [{ t: 'pee', label: 'Urin', cls: 'pee' }, { t: 'poo', label: 'Stuhl', cls: 'poo' }] },
    { key: 'weight', title: 'Gewicht', types: ['weight'], empty: 'Noch kein Gewicht.<br>Unten tippen und eintragen.',
      buttons: [{ t: 'weight', label: 'Gewicht', sub: 'eintragen', cls: 'measure', input: { unit: 'kg', placeholder: 'z.B. 3,45' } }] },
    { key: 'height', title: 'Größe', types: ['height'], empty: 'Noch keine Größe.<br>Unten tippen und eintragen.',
      buttons: [{ t: 'height', label: 'Größe', sub: 'eintragen', cls: 'measure', input: { unit: 'cm', placeholder: 'z.B. 52' } }] },
    { key: 'med', title: 'Medizin', types: ['fever', 'cough', 'med'], empty: 'Nichts notiert.<br>Fieber messen, Husten antippen oder eine Notiz schreiben.',
      buttons: [{ t: 'fever', label: 'Fieber', cls: 'fever', input: { unit: '°C', placeholder: 'z.B. 38,4' } }, { t: 'cough', label: 'Husten', cls: 'cough' }, { t: 'med', label: 'Notiz', cls: 'note', input: { text: true, placeholder: 'z.B. Schnupfen, Zäpfchen' } }] }
  ];
  const TYPE_LABEL = { pee: 'Urin', poo: 'Stuhl', weight: 'Gewicht', height: 'Größe', fever: 'Fieber', cough: 'Husten', med: 'Notiz', feed: 'Stillen' };
  const TYPE_BADGE = { pee: 'U', poo: 'S', weight: 'kg', height: 'cm', fever: '°', cough: 'H', med: '✎' };
  let screen = Math.max(0, SCREENS.findIndex(x => x.key === localStorage.getItem('stillzeit.screen')));
  const cur = () => SCREENS[screen];
  const fmtNum = (v, d) => Number(v).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d });
  const valueLabel = e => e.type === 'weight' ? fmtNum(e.value, 3) + ' kg' : e.type === 'height' ? fmtNum(e.value, 1) + ' cm' : e.type === 'fever' ? fmtNum(e.value, 1) + ' °C' : '';
  const ofScreen = sc => alive().filter(e => sc.types.includes(e.type) && (e.type !== 'feed' || (e.end && (e.end - e.start) >= minMs()))).sort((a, b) => b.start - a.start);

  function goto(i) {
    if (i < 0 || i >= SCREENS.length) return;
    screen = i; armed = null; localStorage.setItem('stillzeit.screen', cur().key);
    window.scrollTo(0, 0);
    syncButton(); render();
  }
  $('navTop').addEventListener('click', () => goto(screen - 1));
  $('navBottom').addEventListener('click', () => goto(screen + 1));
  // vertical swipe: up = next screen (when the list is at its end or the swipe starts in the dock), down = previous (at the top)
  let tsY = null, tsX = null, tsDock = false;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; tsY = t.clientY; tsX = t.clientX; tsDock = !!e.target.closest('.dock'); }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tsY == null) return;

  // ---------- render ----------
  function render() {
    const sc = cur();

    if (!bot.hidden) bot.querySelector('.name').textContent = SCREENS[screen + 1].title;
    const rows0 = ofScreen(sc);
    const list = $('list');
    list.innerHTML = '';
    const groups = new Map();
    for (const it of rows0) { const k = dayKey(it.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
    for (const [k, rows] of groups) {
      const wrap = document.createElement('div'); wrap.className = 'day';
      const head = document.createElement('div'); head.className = 'dayhead';
      let right = '';
      if (sc.key === 'feed') {
        const total = rows.reduce((a, r) => a + (r.end - r.start), 0);

        right = '<span class="cnt">' + rows.length + ' mal</span> <span class="sum">· ' + durLabel(total) + ' gesamt</span>';
      } else if (sc.key === 'diaper') {
        const u = rows.filter(r => r.type === 'pee').length, st = rows.filter(r => r.type === 'poo').length;
        const col = dayColor(rows.length, 40); head.style.background = col.bg; head.style.color = col.fg;
        right = '<span class="cnt">' + rows.length + ' mal</span> <span class="sum">· ' + u + ' Urin · ' + st + ' Stuhl</span>';
      } else {

        right = '<span class="cnt">' + rows.length + '</span>';
      }
      head.innerHTML = '<span>' + dayLabel(k) + '</span><span>' + right + '</span>';
      wrap.appendChild(head);
      for (const it of rows) {
        const el = document.createElement('div'); el.className = 'row' + (armed === it.id ? ' armed' : '');
        let inner;

        } else if (it.type === 'pee' || it.type === 'poo' || it.type === 'cough') {
          inner = '<span class="s ' + it.type + '">' + TYPE_BADGE[it.type] + '</span><span class="t">' + hhmm(it.start) + '</span><span class="d">' + TYPE_LABEL[it.type] + '</span>';
        } else if (it.type === 'med') {
          inner = '<span class="s note">' + TYPE_BADGE.med + '</span><span class="t">' + hhmm(it.start) + '</span><span class="note">' + escapeHtml(it.note || '') + '</span>';
        } else {   // weight, height, fever: value with delta to the previous measurement
          const prev = rows0.filter(r => r.type === it.type && r.start < it.start)[0];
          let delta = '';
          if (prev && it.type !== 'fever') { const d = it.value - prev.value; delta = '<span class="sub">' + (d >= 0 ? '+' : '−') + (it.type === 'weight' ? fmtNum(Math.abs(d) * 1000, 0) + ' g' : fmtNum(Math.abs(d), 1) + ' cm') + '</span>'; }
          inner = '<span class="s ' + (it.type === 'fever' ? 'fever' : 'measure') + '">' + TYPE_BADGE[it.type] + '</span><span class="t">' + hhmm(it.start) + delta + '</span><span class="d">' + valueLabel(it) + '</span>';

  const escapeHtml = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function renderSince() {

  // ---------- the dock: feed buttons or tap buttons per screen ----------

  $('startL').addEventListener('click', () => startFeed('L'));
  $('startR').addEventListener('click', () => startFeed('R'));
  big.addEventListener('click', () => {

  cancel.addEventListener('click', () => { const run = runningFeed(); if (run) { run.deleted = true; save(); } syncButton(); render(); });

  // ---------- value entry (weight, height, fever, note) ----------
  const entry = $('entry'); let entryBtn = null;
  function openEntry(b) {
    entryBtn = b;
    $('entryTitle').textContent = b.label + (b.input.text ? '' : ' in ' + b.input.unit);
    const inp = $('entryVal');
    inp.value = ''; inp.placeholder = b.input.placeholder;

    $('entryUnit').textContent = b.input.text ? '' : b.input.unit;

  function closeEntry() { entry.classList.remove('open'); $('entryVal').blur(); }
  $('entryCancel').addEventListener('pointerdown', e => { e.preventDefault(); history.back(); });
  $('entrySave').addEventListener('pointerdown', e => { e.preventDefault(); saveEntry(); });
  $('entryVal').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveEntry(); } });
  entry.addEventListener('click', e => { if (e.target === entry) history.back(); });
  function saveEntry() {
    const b = entryBtn; if (!b) return;
    const raw = $('entryVal').value.trim();
    if (b.input.text) { if (!raw) return; addEvent({ type: b.t, start: Date.now(), note: raw }); }
    else { const v = Number(raw.replace(',', '.')); if (!raw || !isFinite(v) || v <= 0) return; addEvent({ type: b.t, start: Date.now(), value: v, unit: b.input.unit === '°C' ? 'C' : b.input.unit }); }
    history.back(); render();
  }
  window.addEventListener('popstate', closeEntry);

  // ---------- sync: local-first, optional family account via Supabase ----------
  let session = null;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { session = null; }
  let syncTimer = null, syncing = false, syncState = '', syncMsg = '';
  const jwtPayload = t => JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
  function adoptSession(d) {
    const p = jwtPayload(d.access_token);
    session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: p.exp, email: p.email, uid: p.sub };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }
  function dropSession() { session = null; localStorage.removeItem(SESSION_KEY); }
  async function ensureSession() {
    if (!SYNC || !session) return false;
    if (Date.now() / 1000 < session.expires_at - 60) return true;
    try {
      const r = await fetch(SYNC.url + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', headers: { apikey: SYNC.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!r.ok) {
        let stored = null;
        try { stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (err) { stored = null; }
        if (stored && stored.access_token !== session.access_token) { session = stored; return Date.now() / 1000 < session.expires_at - 60; }
        setSyncState('error', 'Anmeldung abgelaufen. Bitte neu anmelden.');
        return false;
      }
      adoptSession(await r.json());
      return true;
    } catch (e) { return false; }
  }
  const restHeaders = extra => Object.assign({ apikey: SYNC.key, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' }, extra || {});
  const rpc = async (fn, args) => {
    const r = await fetch(SYNC.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: restHeaders(), body: JSON.stringify(args || {}) });
    if (!r.ok) throw new Error((await r.text()).slice(0, 200));
    return r.json();
  };
  const evToRow = e => ({ id: e.id, household_id: db.household_id, child_id: e.child_id, type: e.type, start_ts: e.start, end_ts: e.end || null,
    value: e.value ?? null, unit: e.unit || null, note: e.note || null, side: e.side || null,
    created_by: (session && session.uid) || null, created_at: e.created_at || e.start, updated_at: e.updated_at, deleted: !!e.deleted });
  const rowToEv = r => { const e = { id: r.id, type: r.type, child_id: r.child_id, start: +r.start_ts, created_by: r.created_by, created_at: +r.created_at, updated_at: +r.updated_at };
    if (r.end_ts != null) e.end = +r.end_ts; if (r.value != null) e.value = +r.value; if (r.unit) e.unit = r.unit; if (r.note) e.note = r.note; if (r.side) e.side = r.side; if (r.deleted) e.deleted = true; return e; };
  const chToRow = c => ({ id: c.id, household_id: db.household_id, name: c.name, born: c.born || null, created_at: c.created_at || c.updated_at, updated_at: c.updated_at, deleted: !!c.deleted });
  const rowToCh = r => { const c = { id: r.id, name: r.name, created_at: +r.created_at, updated_at: +r.updated_at }; if (r.born != null) c.born = +r.born; if (r.deleted) c.deleted = true; return c; };

  function setSyncState(s, msg) { syncState = s; syncMsg = msg || ''; renderSyncLine(); renderSyncBox(); }
  function scheduleSync() { if (!SYNC || !session || !db.household_id) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1200); }
  const cursorKey = () => 'stillzeit.lastSync.' + db.household_id;
  const okKey = () => 'stillzeit.lastOk.' + db.household_id;

  // first contact with a household: adopt its children so both phones log the same baby
  async function adoptHousehold(hid) {
    db.household_id = hid;
    const r = await fetch(`${SYNC.url}/rest/v1/sz_children?select=*&household_id=eq.${hid}&deleted=is.false&order=created_at.asc`, { headers: restHeaders() });
    const remote = r.ok ? (await r.json()).map(rowToCh) : [];
    const now = Date.now();
    if (remote.length) {
      const localDefault = db.children.find(c => c.id === db.active_child);
      const target = remote[0];
      if (localDefault && !remote.some(c => c.id === localDefault.id)) {
        for (const e of db.events) if (e.child_id === localDefault.id) e.child_id = target.id;   // re-tag onto the family's child
        db.children = db.children.filter(c => c.id !== localDefault.id);
      }
      for (const c of remote) mergeInto(db.children, c, 'c:');
      db.active_child = target.id;
    }
    for (const c of db.children) { c.updated_at = now; snap['c:' + c.id] = sigOf(c); }
    for (const e of db.events) { e.updated_at = now; snap[e.id] = sigOf(e); }   // old stock must rise above every cursor
    localStorage.removeItem(cursorKey());
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    await syncNow();
  }
  async function syncNow() {
    if (!SYNC || !session || !db.household_id) return;
    if (syncing) { scheduleSync(); return; }
    syncing = true;
    try {
      if (!(await ensureSession())) return;
      const hid = db.household_id, last = +localStorage.getItem(cursorKey()) || 0;
      let maxSeen = last, changed = false;
      const pulled = new Set();   // rows that just arrived need no push back
      const pull = async (table, list, key, conv) => {
        const res = await fetch(`${SYNC.url}/rest/v1/${table}?select=*&household_id=eq.${hid}&updated_at=gt.${last}&order=updated_at.asc`, { headers: restHeaders() });
        if (!res.ok) throw new Error('pull ' + table + ' ' + res.status);
        for (const r of await res.json()) { maxSeen = Math.max(maxSeen, +r.updated_at); const inc = conv(r); if (!mergeInto(list, inc, key)) continue; changed = true; pulled.add(key + inc.id); }
      };
      await pull('sz_children', db.children, 'c:', rowToCh);
      await pull('sz_events', db.events, '', rowToEv);
      const push = async (table, rows) => {
        if (!rows.length) return;
        const r = await fetch(`${SYNC.url}/rest/v1/${table}?on_conflict=household_id%2Cid`, { method: 'POST', headers: restHeaders({ Prefer: 'resolution=merge-duplicates' }), body: JSON.stringify(rows) });
        if (!r.ok) throw new Error('push ' + table + ' ' + (await r.text()).slice(0, 120));
        for (const d of rows) maxSeen = Math.max(maxSeen, d.updated_at);
      };
      await push('sz_children', db.children.filter(c => (c.updated_at || 0) > last && !pulled.has('c:' + c.id)).map(chToRow));
      await push('sz_events', db.events.filter(e => (e.updated_at || 0) > last && !pulled.has(e.id)).map(evToRow));
      localStorage.setItem(cursorKey(), maxSeen + '');
      localStorage.setItem(okKey(), Date.now() + '');
      if (changed) { localStorage.setItem(DB_KEY, JSON.stringify(db)); syncButton(); render(); }
      setSyncState('ok');
    } catch (e) {
      setSyncState(navigator.onLine === false ? 'offline' : 'error', String(e.message || e));
    } finally { syncing = false; }
  }
  async function sendMagicLink(email) {
    const redirect = encodeURIComponent(location.origin + location.pathname);
    const r = await fetch(`${SYNC.url}/auth/v1/otp?redirect_to=${redirect}`, {
      method: 'POST', headers: { apikey: SYNC.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, create_user: true })
    });
    if (r.ok) return { ok: true };
    let msg = 'Senden fehlgeschlagen. Später nochmal.';
    if (r.status === 429) msg = 'Zu viele Anmelde-Mails in kurzer Zeit. In etwa einer Stunde nochmal versuchen.';
    else { try { const j = await r.json(); if (j.msg) msg = 'Senden fehlgeschlagen: ' + j.msg; } catch (e) {} }
    return { ok: false, msg };
  }
  async function findMyHousehold() {          // second device of the same account: pick up the family automatically
    try {
      if (!(await ensureSession())) return null;
      const r = await fetch(`${SYNC.url}/rest/v1/sz_members?select=household_id&user_id=eq.${session.uid}`, { headers: restHeaders() });
      if (!r.ok) return null;
      const rows = await r.json();
      return rows.length ? rows[0].household_id : null;
    } catch (e) { return null; }
  }
  let familyCode = null;
  async function loadFamilyCode() {
    if (!db.household_id || familyCode) return;
    try {
      const r = await fetch(`${SYNC.url}/rest/v1/sz_households?select=code&id=eq.${db.household_id}`, { headers: restHeaders() });
      if (r.ok) { const rows = await r.json(); if (rows[0]) { familyCode = rows[0].code; renderSyncBox(); } }
    } catch (e) {}
  }
  function lastOkLabel() {
    const okAt = +localStorage.getItem(okKey()) || 0;

    const m = Math.floor((Date.now() - okAt) / 60000);

  function renderSyncLine() {

    if (syncState === 'error') { el.className = 'err'; el.textContent = '⚠ Sync fehlgeschlagen · zuletzt ' + lastOkLabel(); return; }

  function renderSyncBox() {

    if (!session) {

    if (!db.household_id) {
      box.innerHTML = '<div class="hint">Angemeldet als ' + session.email + '. Jetzt eine Familie anlegen oder mit dem Code deines Partners beitreten.</div>' +
        '<button id="mkFam" class="primary">Neue Familie anlegen</button>' +
        '<input id="joinCode" type="text" placeholder="Code, z.B. 3F9A-B21C" autocapitalize="characters" autocomplete="off">' +
        '<button id="joinFam">Mit Code beitreten</button><div class="hint" id="famHint"></div>' +
        '<button id="signOut">Abmelden</button>';
      $('mkFam').addEventListener('click', async () => {

        catch (e) { $('famHint').textContent = /unknown code/.test(e.message) ? 'Code unbekannt.' : 'Fehlgeschlagen: ' + e.message; }

    const status = syncState === 'error' ? '⚠ Sync fehlgeschlagen' + (syncMsg ? ' (' + syncMsg + ')' : '') : syncState === 'offline' ? '⏸ Offline' : '✓ Synchron';
    box.innerHTML = '<div class="hint">' + session.email + ' · ' + status + ' · zuletzt ' + lastOkLabel() + '</div>' +
      '<div class="hint">Familien-Code für den Partner:</div><div class="code">' + (familyCode || '…') + '</div>' +
      '<button id="shareCode" class="primary">Code teilen</button>' +
      '<button id="syncBtn">Jetzt synchronisieren</button>' +
      '<button id="leaveFam">Dieses Handy von der Familie trennen</button>';
    $('shareCode').addEventListener('click', async () => {
      const text = 'Stillzeit Familien-Code: ' + familyCode + '\n' + location.origin + location.pathname + '\nApp öffnen, ⋯ → anmelden → "Mit Code beitreten".';

  // ---------- menu: export / import ----------
  const sheet = $('sheet');
  function download(name, text, mime) {
    const a = document.createElement('a');

  const stamp = () => dayKey(Date.now());
  $('menu').addEventListener('click', () => {
    $('stats').textContent = feeds().length + ' Einträge · Kind: ' + ((db.children.find(c => c.id === db.active_child) || {}).name || '');
    renderSyncBox();
    $('minSec').value = db.settings.minSeconds || 0;
    sheet.classList.add('open'); history.pushState({ sheet: 1 }, '');
  });
  $('minSec').addEventListener('input', () => {
    db.settings.minSeconds = Math.max(0, Math.floor(Number($('minSec').value) || 0));
    localStorage.setItem(DB_KEY, JSON.stringify(db)); syncButton(); render();
  });
  const closeSheet = () => sheet.classList.remove('open');
  $('closeSheet').addEventListener('click', () => history.back());
  sheet.addEventListener('click', e => { if (e.target === sheet) history.back(); });
  window.addEventListener('popstate', closeSheet);
  $('exportJson').addEventListener('click', () => download('stillzeit-' + stamp() + '.json', JSON.stringify(db, null, 2), 'application/json'));
  $('exportCsv').addEventListener('click', () => {
    const iso = ts => new Date(ts).toISOString();
    const rows = [['type', 'child', 'start', 'end', 'minutes', 'side', 'value', 'unit', 'note']];
    for (const e of db.events.filter(e => !e.deleted && (e.type !== 'feed' || e.end)).sort((a, b) => a.start - b.start)) {
      const child = (db.children.find(c => c.id === e.child_id) || {}).name || '';
      rows.push([e.type, child, iso(e.start), e.end ? iso(e.end) : '', e.end ? mins(e.end - e.start) : '', e.side ?? '', e.value ?? '', e.unit ?? '', e.note ?? '']);
    }
    download('stillzeit-' + stamp() + '.csv', rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n'), 'text/csv');
  });
  $('importJson').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const inc = JSON.parse(await f.text());
      if (inc.schema !== 2 || !Array.isArray(inc.events)) throw new Error('kein Stillzeit-Export');
      let n = 0;
      for (const c of inc.children || []) if (mergeInto(db.children, c, 'c:')) n++;
      for (const o of inc.events) if (mergeInto(db.events, o, '')) n++;
      const now = Date.now();
      for (const o of inc.events) { const ev = db.events.find(x => x.id === o.id); if (ev) { ev.updated_at = now; snap[ev.id] = sigOf(ev); } }
      localStorage.setItem(DB_KEY, JSON.stringify(db)); scheduleSync(); syncButton(); render();
      $('stats').textContent = n + ' Einträge übernommen';
    } catch (err) { $('stats').textContent = 'Import fehlgeschlagen: ' + err.message; }
    e.target.value = '';
  });

  // refresh "vor x min" once a minute, pull the family's changes, and after the phone wakes up
  setInterval(() => { render(); syncNow(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); syncButton(); render(); syncNow(); } });
  window.addEventListener('online', syncNow);

  // ---------- keep the screen on while the app is in front (released by the OS when another app comes up) ----------
  let wakeLock = null;
  async function keepAwake() {
    if (!('wakeLock' in navigator) || document.hidden) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  keepAwake();

  // ---------- boot ----------
  load();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  // magic-link return: tokens arrive in the URL hash, never on the server
  if (location.hash.includes('access_token=')) {
    try {
      const q = new URLSearchParams(location.hash.slice(1));
      if (q.get('access_token') && q.get('refresh_token')) adoptSession({ access_token: q.get('access_token'), refresh_token: q.get('refresh_token') });
    } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  syncButton();
  render();
  if (SYNC && session) {
    if (db.household_id) { syncNow(); loadFamilyCode(); }
    else findMyHousehold().then(hid => { if (hid) return adoptHousehold(hid).then(() => { renderSyncBox(); loadFamilyCode(); }); });
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
